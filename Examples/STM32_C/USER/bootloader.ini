/*----------------------------------------------------------------------------
 * Name:   bootloader.ini
 * Purpose: to use the bootloader offset address to avoid erasesr the bootloader
 * Note(s):
/*----------------------------------------------------------------------------
  Setup()  configure PC & SP for RAM Debug
 *----------------------------------------------------------------------------*/
FUNC void Setup (void) {
  SP = _RDWORD(0x8000000);
  PC = _RDWORD(0x8000004);
  _WDWORD(0xE000ED08, 0x8000000);   // Setup Vector Table Offset Register
}

FUNC void OnResetExec (void)  {      // executes upon software RESET
  Setup();                           // Setup for Running
}

LOAD %L INCREMENTAL                  // load the application

Setup();                          // Setup for Running
